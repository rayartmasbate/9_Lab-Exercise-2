spring.application.name=CRUD-Application

# MySQL Datasource Settings
spring.datasource.url=jdbc:mysql://localhost:3307/dbcrud1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=8080
spring.web.error.include-stacktrace=never