spring.application.name=demo

#Setup JDBC connection
#make sure you have created a database in Workbench or any SQL db engine. The #database 
# name I created was db_pmss
spring.datasource.url=jdbc:mysql://localhost:3307/dbcrud1

#Setup db login credentials
spring.datasource.username=root
spring.datasource.password=

#Auto create tables based on entities
# spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#for stack trace error not to appear 
server.error.include-stacktrace=never
server.port = 8080
security.basic.enabled=false